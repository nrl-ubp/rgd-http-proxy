# Defaults of the fuzzy search module. The application's configuration (config/application.properties)
# overrides these values, except the build-time ones, which are fixed when the application is built.

# The PERSON table is read through its own named datasource. Its kind is fixed at build time; its JDBC
# URL, its credentials and whether it is active are runtime settings, see config/sample.application.properties.
quarkus.datasource."fuzzy-search".db-kind=mssql
# Inactive, hence never started nor health checked, while the fuzzy search is off.
quarkus.datasource."fuzzy-search".active=${fuzzy-search.enabled:false}

# The health check of the Elasticsearch REST client would report the whole proxy down whenever
# OpenSearch is unreachable, even with the fuzzy search off: FuzzySearchHealthCheck replaces it.
quarkus.elasticsearch.health.enabled=false
