# Native image configuration of the IBM MQ client (not native-ready upstream). The classes it loads by
# name, its message catalogs and data files are in reflect-config.json and resource-config.json, next
# to this file.
# Its static initializers start thread pools and read the environment: they must run in the executable,
# not while the image is built.
Args = --initialize-at-run-time=com.ibm.mq,com.ibm.msg,com.ibm.jakarta
