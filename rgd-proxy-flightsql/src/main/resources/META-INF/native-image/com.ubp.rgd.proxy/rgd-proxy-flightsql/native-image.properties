# Native image configuration of Apache Arrow Flight SQL (not native-ready upstream). The reflection it
# needs is in reflect-config.json, next to this file.
# - Arrow computes Unsafe field offsets and allocates Netty buffers in its static initializers, grpc-netty
#   holds Netty allocators, and protobuf computes Unsafe field offsets: they must run in the executable,
#   not while the image is built, where the offsets and buffers would be those of the build JVM.
# - Arrow reaches the address of the direct buffers by reflection: the equivalent of the
#   --add-opens=java.base/java.nio=ALL-UNNAMED the JVM is started with.
Args = --initialize-at-run-time=org.apache.arrow,io.grpc.netty,com.google.protobuf.UnsafeUtil \
       --add-opens=java.base/java.nio=ALL-UNNAMED
