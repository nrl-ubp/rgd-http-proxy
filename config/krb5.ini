[libdefaults]
   default_realm = CORP.UBP.CH
   default_tkt_enctypes = aes256-cts-hmac-sha1-96 aes256-cts aes128-cts aes128-cts-hmac-sha1-96
   default_tgs_enctypes = aes256-cts-hmac-sha1-96 aes256-cts aes128-cts aes128-cts-hmac-sha1-96
   permitted_enctypes   = aes256-cts-hmac-sha1-96 aes256-cts aes128-cts aes128-cts-hmac-sha1-96
   forwardable = true
   proxiable = true
  
[realms]
CORP.UBP.CH={
   kdc=dcgva.corp.ubp.ch
   admin_server=dcgva.corp.ubp.ch
   default_domain=CORP.UBP.CH
}
  
[domain_realm]
    corp.ubp.ch=CORP.UBP.CH
    .corp.ubp.ch=CORP.UBP.CH
