input {
  http_poller {
    urls => {
      quarkus_metrics => "http://<IP_DE_VOTRE_SERVEUR>:8080/q/metrics"
    }
    # Le endpoint Prometheus renvoie du texte brut
    codec => "plain"
    # Intervalle de collecte (toutes les 30 secondes)
    schedule => { '*/30' => 'every 30 seconds' }
    request_timeout => 5
  }
}

filter {
  # 1. Decouper l'exposition Prometheus en lignes (1 ligne = 1 serie temporelle)
  split {
    field => "message"
    terminator => "\n"
  }

  # 2. Ignorer les commentaires (# HELP / # TYPE) et les lignes vides
  if [message] =~ /^\s*#/ or [message] =~ /^\s*$/ {
    drop { }
  }

  # 3. Parser: metric_name{label="value",...} valeur
  grok {
    match => {
      "message" => "^(?<metric_name>[a-zA-Z_:][a-zA-Z0-9_:]*)(?:\{(?<labels>[^}]*)\})?[ \t]+(?<metric_value>[0-9eE.+-]+|NaN)"
    }
    tag_on_failure => ["_prometheus_parse_failure"]
  }

  if "_prometheus_parse_failure" in [tags] {
    drop { }
  }

  # 4. Ne conserver que les metriques applicatives ubp_*
  if [metric_name] !~ /^ubp_/ {
    drop { }
  }

  # 5. Eclater les labels Prometheus en champs structures :
  #    label.method, label.uri, label.stat (min|max|avg), label.name, ...
  if [labels] and [labels] != "" {
    kv {
      source => "labels"
      field_split => ","
      value_split => "="
      trim_key => " "
      trim_value => "\""
      target => "label"
    }
  }

  mutate {
    convert => { "metric_value" => "float" }
    remove_field => ["message", "labels", "tags", "event"]
    add_field => { "service_name" => "rgd-http-proxy" }
  }
}

output {
  opensearch {
    hosts => ["http://<IP_OPENSEARCH>:9200"]
    index => "quarkus-metrics-%{+YYYY.MM.dd}"
    user => "admin"          # Remplacez par vos identifiants
    password => "votre_mdp"  # Remplacez par vos identifiants
    # ssl => true            # A activer si votre OpenSearch est en HTTPS
    # ca_cert => "/chemin/vers/certif.pem"
  }

  # Pour le debug (a supprimer en production)
  # stdout { codec => rubydebug }
}
