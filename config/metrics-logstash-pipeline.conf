input {
  http_poller {
    urls => {
      quarkus_metrics => "http://<IP_DE_VOTRE_SERVEUR>:8080/q/metrics"
    }
    # On demande de récupérer le texte brut
    codec => "plain"
    # Intervalle de collecte (ex: toutes les 30 secondes)
    schedule => { '*/30' => 'every 30 seconds' }
    request_timeout => 5
  }
}

filter {
  # 1. Découper la grande chaîne de texte en lignes individuelles
  # Chaque ligne correspond à une métrique (ex: http_requests_total 42)
  split {
    field => "message"
    delimiter => "\n"
  }

  # 2. Parser chaque ligne pour extraire le nom de la métrique et sa valeur
  # Le format Prometheus est : metric_name{labels} value
  grok {
    match => { "message" => "%{DATA:metric_name}(?:\{%{DATA:labels}\})? %{NUMBER:metric_value:float}" }
  }

  # 3. Nettoyage : on supprime le champ message brut et les labels si on n'en a pas besoin
  # On peut aussi ajouter un timestamp pour la précision
  mutate {
    remove_field => ["message", "tags"]
    add_field => { "service_name" => "mon-app-quarkus" }
  }

  # Optionnel : transformer le nom de la métrique en champ structuré si besoin
}

output {
  opensearch {
    hosts => ["http://<IP_OPENSEARCH>:9200"]
    index => "quarkus-metrics-%{+YYYY.MM.dd}"
    user => "admin"          # Remplacez par vos identifiants
    password => "votre_mdp"  # Remplacez par vos identifiants
    # ssl => true            # À activer si votre OpenSearch est en HTTPS
    # ca_cert => "/chemin/vers/certif.pem"
  }

  # Pour le debug (à supprimer en production)
  # stdout { codec => rubydebug }
}
