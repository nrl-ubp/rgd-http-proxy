#
# SAMPLE application.properties file.
#
# This file is a starter for your application configuration.
# Fill the proxy.transform.* properties to suit your need.
#
# To configure the application, you need to COPY this sample file and name it : "application.properties"
#

# Configuration HTTP server
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Configuration HTTPS server
quarkus.http.ssl-port=8443
%prod.quarkus.http.ssl-port=443

# p12 format certs for https
quarkus.http.ssl.certificate.key-store-file=./config/certs/serverkeystore.p12
quarkus.http.ssl.certificate.key-store-file-type=PKCS12
quarkus.http.ssl.certificate.key-store-password=changeit

# Configuration du proxy
proxy.target.base-url=http://localhost:37200
%test.proxy.target.base-url=http://localhost:37200/api/say

# RegData Transform API configuration
proxy.transform.config-file=./config/rps_transform_config.json

# The following properties must be set using system environment variables
# because they are dependent of the environment wee run the application
# naming convention : replace all dots (.) by dashes (-) and quarkus config
# will be automatically loaded into these properties.
proxy.transform.client-id=
proxy.transform.client-secret=
proxy.transform.identity-url=
proxy.transform.engine-url=

# token utils are end points that can transform and return another tokenized value
# authorization property allows only users from the SPN below to execute token utils endpoint
token.utils.wdx1.authorized-spn=
%dev.token.utils.wdx1.authorized-spn=HTTP/wdx1e01.corp.ubp.ch

# Outbound requests client trust all certs. Otherwise they must be trustued in cacerts of the JVM
# See import-certs.ps1 script to import a site certificate into cacerts.
proxy.ssl.trust-all=true

# Configuration Kerberos
kerberos.debug=false
%dev.kerberos.debug=true

java.security.krb5.debug=false
%dev.java.security.krb5.debug=true

proxy.kerberos.keytab-path=./config/certs/rgd.keytab
proxy.kerberos.service-principal-name=HTTP/tokenization-secure-gvz-e01.corp.ubp.ch
proxy.kerberos.service-principal-realm=CORP.UBP.CH

# LDAP configuration
quarkus.naming.enable-jndi=true
%dev.quarkus.naming.enable-jndi=true
%prod.quarkus.naming.enable-jndi=true

# Cache configuration
quarkus.cache.caffeine.expire-after-write=600S

# Log configuration
quarkus.log.console.enable=true

quarkus.log.level=INFO
%dev.quarkus.log.level=DEBUG

# fine logger configuration if needed.
# quarkus.log.category."com.example.proxy".level=DEBUG

%dev.quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=false

# sends logs to logstash
quarkus.log.socket.enable=true
quarkus.log.socket.json.enabled=true
quarkus.log.socket.endpoint=lxvgvzrgdev003s:8181

# to have the exception serialized into a single text element
quarkus.log.socket.json.exception-output-type=formatted

# specify the format of the produced JSON log
# quarkus.log.socket.json.log-format=ECS

# Monitoring configuration
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.smallrye-health.root-path=/health
quarkus.cache.caffeine.metrics-enabled=true


# OpenAPI / Swagger configuration
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi



