# Packaged defaults. The deployment's config/application.properties overrides these values
# (except the build-time ones, which are fixed when the application is built).

# --- Resolution of the secrets manager that created a token (see TokenSecretsManagerResolver) ---
# The named datasource must be declared at build time; its JDBC URL and credentials are runtime
# settings, see config/sample.application.properties.
quarkus.datasource."secrets-manager-lookup".db-kind=mssql

# No Dev Services: they would start MongoDB / SQL Server containers in dev and test mode.
quarkus.devservices.enabled=false

# Resolved token -> secrets manager ids kept in memory. Failed resolutions are never cached.
quarkus.cache.caffeine."token-secrets-manager".maximum-size=10000
quarkus.cache.caffeine."token-secrets-manager".expire-after-write=PT1H
