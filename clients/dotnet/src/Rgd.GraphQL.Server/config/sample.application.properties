# Configuration of the RGD GraphQL server.
#
# Copy this file to application.properties, in the same directory, and fill in the credentials.
# application.properties is ignored by git since it holds the Flight SQL password.
#
# Any property can be overridden by an environment variable, dots becoming double underscores and
# dashes being dropped: FLIGHTSQL__PASSWORD overrides flightsql.password.

# --- HTTP server --------------------------------------------------------------------------------
server.urls=http://0.0.0.0:5080

# --- GraphQL ------------------------------------------------------------------------------------
graphql.path=/graphql
# Model the schema is generated from, relative to this directory.
graphql.model-file=model.json
# Serves the Nitro IDE on graphql.path and allows introspection.
graphql.enable-tooling=true
graphql.include-exception-details=false

# --- Flight SQL connection ----------------------------------------------------------------------
flightsql.host=localhost
flightsql.port=32010
# Database credentials, validated by the rgd-http-proxy against the proxied datasource.
flightsql.username=sa
flightsql.password=
flightsql.tls.enabled=false
# Accepts any server certificate, development only.
flightsql.tls.trust-server-certificate=false
flightsql.timeout-seconds=30
# Statement of the health check (/health) and of the startup connection check.
flightsql.health-query=SELECT 1
# Stops the server when the Flight SQL server cannot be reached at startup.
flightsql.fail-on-startup-error=false
flightsql.max-receive-message-size-mb=64

# --- SQL generation -----------------------------------------------------------------------------
# Ansi (H2, PostgreSQL, ...) or SqlServer, the database behind the Flight SQL server.
sql.dialect=SqlServer
# Quoted identifiers are case-sensitive: the model must then match the case of the database.
sql.quote-identifiers=true
sql.max-in-list-size=1000

# --- Logging ------------------------------------------------------------------------------------
logging.level.Default=Information
logging.level.Microsoft.AspNetCore=Warning
# Debug logs every SQL statement sent to the Flight SQL server.
logging.level.Rgd.GraphQL.Server.Data=Information
