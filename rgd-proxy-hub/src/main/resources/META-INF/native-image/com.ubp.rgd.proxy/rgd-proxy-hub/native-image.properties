# Native image configuration of the application (reflection and resources: reflect-config.json,
# resource-config.json next to this file).
# The security providers the Kerberos (JGSS) and LDAP (SASL GSSAPI) authentication look up by name.
Args = -H:+UnlockExperimentalVMOptions -H:AdditionalSecurityProviders=sun.security.jgss.SunProvider,com.sun.security.sasl.Provider,com.sun.security.sasl.gsskerb.JdkSASL -H:-UnlockExperimentalVMOptions
